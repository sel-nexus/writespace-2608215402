services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/writespace.db
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - backend_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
